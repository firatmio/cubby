[package]
name = "mc-server-launcher"
version = "0.2.0-beta.1"
description = "Cubby: arkadaşlarınla kendi Minecraft dünyan"
authors = ["firatmio"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mc_server_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
arboard = { version = "3.7", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "process", "io-util", "sync", "time", "macros"] }
futures-util = "0.3.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
hex = "0.4.3"
thiserror = "2.0.21"
sysinfo = "0.39.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
uuid = { version = "1.28.0", features = ["v4"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "query", "form"] }
trash = "5.2.9"
tauri-plugin-dialog = "2.8.1"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
flate2 = "1.1.10"
tar = "0.4.46"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
local-ip-address = "0.6.13"
md-5 = "0.11.0"
igd-next = { version = "0.18", features = ["aio_tokio"] }
tokio-util = "0.7"
iroh = "1.3"
fastnbt = "2.6"
base64 = "0.22"
tauri-plugin-deep-link = "2.6"
# Microsoft yenileme anahtarı: Windows Kimlik Bilgisi Yöneticisi / macOS Anahtar Zinciri / Secret Service
# İlk açılışta arayüz dili için bilgisayarın dili
sys-locale = "0.3.2"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
tauri-plugin-updater = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["net", "macros", "rt-multi-thread", "io-util"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
